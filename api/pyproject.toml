[project]
name = "rockem-api"
version = "0.0.0"
description = "The edge: reads a bundle, speaks the wire. Runs on the cluster; never on the node."
requires-python = ">=3.13,<3.14"
dependencies = [
  "tokenizers==0.22.1",
  "fastapi==0.118.0",
  "fastcbv==0.1.1",
  "uvicorn==0.37.0",
  "jinja2==3.1.6",
  "numpy==2.3.3",
  "soundfile==0.13.1",
  "soxr==1.0.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "anyio==4.11.0", "httpx==0.28.1"]

[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rockem"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
