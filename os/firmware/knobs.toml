# metatron's firmware, as rockem wants it. `knobs.efi` (os/firmware/knobs) runs ahead of the
# kernel on every boot: it reads each knob below out of its UEFI setup store, writes the ones
# that differ, and resets if it wrote anything; otherwise it returns and iPXE boots the kernel.
# The firmware's configuration is part of the image: a knob is a line here, a commit and a
# publish (tcdent, 2026-10-16: "a standardized and documented place for us to maintain the
# flags"). Offsets come from localai.hardware's parse of the vendor BIOS image
# (~/Work/localai/motherboards/huananzhi-h12d-16d/artifacts/setup-knobs.csv, the GN = Milan
# formset of the CBS store); the firmware block below is what the running board must report
# before anything is written, since offsets from another build can leave the box unable to POST.

[firmware]
vendor = "American Megatrends International, LLC."
version = "1.1"
date = "04/23/2026"
# The first run (2026-10-16 14:10) read the knobs tcdent had set in the setup UI — NPS2, APBDIS 1,
# SoC P0 — back from exactly these offsets on this build: the table holds. From then on the
# stage writes what differs.
read_only = false

[[store]]
name = "AmdSetup"
guid = "3a997502-647a-4c82-998e-52ef9486a247"
# AMD CBS, the GN (Milan) formset. AmdSetupSSP and AmdSetupZP share the GUID with other offsets.

[[store]]
name = "Setup"
guid = "ec87d643-eba4-4bb5-a1e5-3f3e36b20da9"
# AMI's own setup store — the Milan build's 290-byte layout (localai.hardware 2026-10-16).

[[knob]]
store = "Setup"
name = "Variable protection"
offset = 0x4A
value = 0
why = "Disabled: 'Password protection of Runtime Variables' (help text: through the System Admin Password), suspected as the lock behind SECURITY_VIOLATION on AmdSetup (2026-10-16); ships Enabled, and its form (Advanced → UEFI Variables Protection) is hidden by the flag below. Milan layout: the vendor image holds a Rome build (Setup 361 B) and a Milan build (290 B) and the 7R13s run the Milan one; the Rome offsets (0x91, 0xFF) read the Milan default blob's padding."

[[knob]]
store = "Setup"
name = "Hide variable protection"
offset = 0xB8
report = true
why = "The vendor's hidden numeric that suppresses the UEFI Variables Protection form (and the debug-port, SIO, PCIe link-training and compliance pages) in the setup UI: SuppressIf == 1, ships 1. Read and reported only."

[[knob]]
store = "AmdSetup"
name = "NUMA nodes per socket"
offset = 0xD1
value = 2
why = "NPS2: a node's four channels stream at 84–93 GB/s and the box's 16 at 334, against 306–314 as one node a socket; the expert stream is laid out in node runs (2026-10-15)."

[[knob]]
store = "AmdSetup"
name = "APBDIS"
offset = 0x1D0
value = 1
why = "The fabric's power-state algorithm off; with the SoC P-state pinned, socket 0's nodes went 84 → 93 GB/s (2026-10-16)."

[[knob]]
store = "AmdSetup"
name = "Fixed SoC P-state"
offset = 0x1D2
value = 0
why = "P0: the fabric clock pinned at its top (shown once APBDIS is 1)."

[[knob]]
store = "AmdSetup"
name = "DF C-states"
offset = 0x1D1
value = 0
why = "Disabled: the data fabric must not drop into power states between the host's expert bursts. Measured 2026-10-16 (probe boots before/after): no change in any node's stream rate (84–92 / 83–92 / 79 / 86 GB/s, 321–323 total); kept off on the appliance principle — nothing of ours wants the fabric asleep."

[[knob]]
store = "AmdSetup"
name = "HSMP Support"
offset = 0x1D4
value = 1
why = "Enabled: the host-to-SMU mailbox (/dev/hsmp); per-socket fabric and memory clocks, DDR bandwidth, DIMM thermals and a runtime DF P-state — the per-socket read that tells whether socket 1 followed the fabric pin (2026-10-16)."

[[knob]]
store = "AmdSetup"
name = "DRAM Power Down Enable"
offset = 0x11F
value = 0
why = "Disabled: the DIMMs must not enter power-down between the host's expert bursts (a burst every ~37 ms, the DRAM idle while the cards run attention); appliance principle, measured by the profile (2026-10-16)."

[[knob]]
store = "AmdSetup"
name = "xGMI Link Width Control"
offset = 0x1CB
value = 1
why = "Manual: dynamic link width management off; the token crosses sockets every phase (pool items on both sockets, the cards on socket 1, the shared host buffers) and a narrowed link re-widens with a latency we pay per handoff (2026-10-16)."

[[knob]]
store = "AmdSetup"
name = "xGMI Force Link Width Control"
offset = 0x1CD
value = 1
why = "Force: with the control Manual, hold the forced width below."

[[knob]]
store = "AmdSetup"
name = "xGMI Force Link Width"
offset = 0x1CC
value = 2
why = "2 = x16, the full width of every xGMI link."

