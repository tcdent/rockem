[package]
name = "bundle"
version = "0.0.0"
edition = "2021"
description = "Bundle builder: checkpoint → named layouts. Quantizes and packs through ops so the format has one definition. Dev box only."

[dependencies]
harness = { path = "../bringup/harness" }
common = { path = "../common", features = ["std"] }
deepseek_v2_lite = { path = "../models/deepseek-v2-lite", features = ["std"] }
glm_5_3_flash = { path = "../models/glm-5.3-flash", features = ["std"] }
voxtral_small_24b = { path = "../models/voxtral-small-24b", features = ["std"] }
granite_speech_4_1_2b = { path = "../models/granite-speech-4.1-2b", features = ["std"] }
memmap2 = "0.9"
serde_json = "1.0.151"

[profile.release]
opt-level = 3
