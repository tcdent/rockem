[package]
name = "glm_5_3_flash"
version = "0.0.0"
edition = "2021"
description = "GLM-5.3-Flash: the pinned config, its constants, and the f32 transcription of the reference forward that bring-up diffs against the oracle."

[features]
std = ["common/std", "dep:prow"]
stats = ["common/stats"]
stats_tail = ["stats", "common/stats_tail"]
stats_r = ["stats", "common/stats_r"]
# prow categories (host only: prow comes with `std`; the GPU build of this crate never links it).
# The step's phases as zones on the main thread, each layer's lap from its start to its end, with
# the routed experts, the pool's runs and the host's join for the cards' experts nested inside by time.
track-zones = []
# The CPU expert phase's items: a row a pool run a token-count bucket (items, their summed time, the
# bytes they streamed, the (token, expert) pairs they served) — what bounds the phase, by the items' shape.
track-experts = []
# Not a prow category: each decode layer's predictor inputs and labels appended to /tmp/pred.bin (layer, tokens; a
# token's picks at the layer, its quantized FFN input and scales, the next layer's route-ahead logits) for offline
# predictor experiments (docs/expert-cache-architecture.md, phase 3). A lab build only: ~5 KB a token-layer.
dump-pred = []

[dependencies]
common = { path = "../../common" }
prow = { path = "../../../prow", optional = true }
