[package]
name = "deepseek_v2_lite_gpu"
version = "0.0.0"
edition = "2021"
description = "The code object: deepseek_v2_lite's GPU kernel entries compiled for gfx1100 into one ELF the bundle carries. Built with the pinned nightly; see .cargo/config.toml."

[lib]
crate-type = ["cdylib"]

[dependencies]
deepseek_v2_lite = { path = ".." }

[features]
# the bring-up code object with `stat!` live: `cargo +nightly build --release --features stats`
stats = ["deepseek_v2_lite/stats"]

[workspace]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

[profile.dev]
opt-level = 1
lto = true
panic = "abort"
incremental = false
