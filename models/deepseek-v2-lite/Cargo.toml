[package]
name = "deepseek_v2_lite"
version = "0.0.0"
edition = "2021"
description = "DeepSeek-V2-Lite: the pinned checkpoint identity, its constants, its fused per-layer kernels, and (with `std`) its construction — weights, tables, state, the decode step."
build = "build.rs"

[dependencies]
common = { path = "../../common" }

[features]
std = ["common/std"]
stats = ["common/stats"]

[dev-dependencies]
serde_json = "1"
common = { path = "../../common", features = ["std"] }
