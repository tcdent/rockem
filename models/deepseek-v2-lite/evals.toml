# Published benchmarks and what this stack measures on them. The tasks live in
# bringup/evals/ and run against a served node over the wire, through the edge's own
# client, under the model's sampling recipe; a bundle never carries this file. Each run
# names the bundle, its identity and recipe, so a kernel or recipe change shows against
# the anchor the paper used. Resolution: one HumanEval problem is 0.6 points and the
# binomial noise at this pass rate is ~3.6 points; the exact prompt and stop rules also
# move published scores by a point or two between harnesses.

[humaneval]
published = 29.9
source = "DeepSeek-V2-Lite model card, base model (paper's decoding, not stated)"
protocol = "zero-shot, one sample per problem under the model's recipe, stops at the next top-level statement, 512 tokens at most"

