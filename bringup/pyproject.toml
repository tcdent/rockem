[project]
name = "rockem-bringup"
version = "0.0.0"
description = "Oracle (HF torch) golden capture and per-op diff harness. Dev box only; never on the node."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "transformers==4.56.1",
  "safetensors==0.6.2",
  "huggingface-hub==0.35.0",
  "numpy==2.3.3",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
